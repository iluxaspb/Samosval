name: Deploy independent TEST Firebase reserve (Cloud Run)

on:
  push:
    branches:
      - feature/test-replication-20261030
    paths:
      - "server/**"
      - ".github/workflows/deploy-test-firebase-reserve.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-samosval-test-firebase-reserve
  cancel-in-progress: false

jobs:
  validate-cloud-access:
    name: Validate TEST-only Cloud Run deployment identity
    runs-on: ubuntu-latest
    outputs:
      region: ${{ steps.validate.outputs.region }}
    steps:
      - name: Require explicit TEST project and configured OIDC identities
        id: validate
        shell: bash
        env:
          WIF: ${{ vars.TEST_GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.TEST_GCP_DEPLOY_SA }}
          RUNTIME_SA: ${{ vars.TEST_GCP_RUNTIME_SA }}
          REQUESTED_REGION: ${{ vars.TEST_GCP_REGION }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "iluxaspb/Samosval" || "$GITHUB_REF" != "refs/heads/feature/test-replication-20261030" ]]; then
            echo "::error::Deployment is restricted to the isolated Samosval feature branch."
            exit 1
          fi
          if [[ -z "$WIF" || -z "$DEPLOY_SA" || -z "$RUNTIME_SA" ]]; then
            echo "::error::Cloud Run was NOT deployed: configure TEST_GCP_WIF_PROVIDER, TEST_GCP_DEPLOY_SA and TEST_GCP_RUNTIME_SA as GitHub Actions repository variables (no private keys)."
            exit 1
          fi
          if [[ ! "$WIF" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-zA-Z0-9_-]+/providers/[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid Workload Identity Federation provider name."
            exit 1
          fi
          if [[ ! "$DEPLOY_SA" =~ ^[a-z0-9-]+@samosval-offline\.iam\.gserviceaccount\.com$ || ! "$RUNTIME_SA" =~ ^[a-z0-9-]+@samosval-offline\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::Deploy and runtime identities must be dedicated service accounts in samosval-offline."
            exit 1
          fi
          region="${REQUESTED_REGION:-europe-north1}"
          if [[ ! "$region" =~ ^europe-(north1|west1|west4)$ ]]; then
            echo "::error::Only approved nearby TEST regions are allowed."
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "TEST-only identity configuration validated. Cloud auth will be verified by Google."

  test-reserve:
    name: Verify reserve business API before cloud deployment
    needs: validate-cloud-access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked server dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Independent reserve and deploy-smoke tests
        run: |
          node --check server/src/test-reserve-service.mjs
          node --check server/scripts/smoke-test-reserve.mjs
          node --test server/tests/test-reserve-http.test.mjs server/tests/test-reserve-line.test.mjs server/tests/test-auto-line-client.test.mjs server/tests/test-deploy-reserve-smoke.test.mjs
      - name: Validate reserve Dockerfile
        run: docker build -f server/Dockerfile.reserve -t samosval-test-reserve:${{ github.sha }} server

  deploy-reserve:
    name: Deploy TEST reserve and probe real HTTPS endpoint
    needs: [validate-cloud-access, test-reserve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: firebase-reserve-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare isolated Docker build context (never NAS image)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cloudrun-reserve
          cp server/Dockerfile.reserve .cloudrun-reserve/Dockerfile
          cp server/package.json server/package-lock.json .cloudrun-reserve/
          cp -a server/src .cloudrun-reserve/src
          test -f .cloudrun-reserve/src/test-reserve-service.mjs
          ! grep -q 'src/index.mjs' .cloudrun-reserve/Dockerfile
      - uses: google-github-actions/auth@v3
        with:
          project_id: samosval-offline
          workload_identity_provider: ${{ vars.TEST_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.TEST_GCP_DEPLOY_SA }}
      - name: Deploy to isolated Google Cloud TEST project
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: samosval-test-reserve
          source: .cloudrun-reserve
          env_vars: |
            FIREBASE_PROJECT_ID=samosval-offline
            TEST_RESERVE_SERVE_ENABLED=1
            NODE_ENV=production
          env_vars_update_strategy: overwrite
          flags: >-
            --project=samosval-offline
            --region=${{ needs.validate-cloud-access.outputs.region }}
            --service-account=${{ vars.TEST_GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --concurrency=20
            --memory=512Mi
            --cpu=1
            --timeout=30s
      - name: Confirm deployed TEST project, Firebase Auth gating and CORS
        env:
          RESERVE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node server/scripts/smoke-test-reserve.mjs "$RESERVE_URL"
          echo "TEST Cloud Run HTTP gate verified at this commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Public URL is TEST-only. No NAS promotion or mobile release was executed." >> "$GITHUB_STEP_SUMMARY"
