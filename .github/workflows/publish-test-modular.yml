name: Publish modular TEST build (production untouched)
on:
  push:
    branches: [root]
    paths:
      - 'test-app/source/**'
      - 'test-app/src/pwa.js'
      - 'test-app/modules.json'
      - 'tools/build-test.py'
      - '.github/workflows/publish-test-modular.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: samosval-test-modular-publish
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modified source scripts
        run: |
          node --check test-app/source/features/settings-hub.js
          node --check test-app/source/features/release-history.js
          node --check test-app/src/pwa.js
          node --check test-app/source/features/test-release.js
      - name: Compile deterministic test assets
        run: python3 tools/build-test.py
      - name: Verify manifest hashes and unchanged production files
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'test-app/build-manifest.json').read_text())
          html=(root/'index-test.html').read_text()
          assert 'name="test-app-version" content="3.4.24"' in html
          assert m['channel'].startswith('test-3.4.24-')
          assert 'settings-hub.js' in html
          source=(root/'test-app/source/features/settings-hub.js').read_text()
          assert "input.min='-0.4'" in source
          assert "margin:12px 16px 14px!important" in source
          assert "input.dispatchEvent(new Event('input',{bubbles:true}))" in source
          for asset in m['assets']:
              p=root/asset['url']
              assert p.is_file(),str(p)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==asset['sha256'],str(p)
          assert m['version'] in (root/'sw-test.js').read_text()
          print('TEST_BUILD_OK',m['version'],len(m['assets']))
          PY
          node --check sw-test.js
          test -z "$(git diff HEAD --name-only -- index.html sw.js manifest.json app/)"
      - name: Publish test-only files
        run: |
          git config user.name "Samosval Test Build"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index-test.html sw-test.js test-app/build-manifest.json test-app/build/
          if ! git diff --cached --quiet; then
            git commit -m "build(test): publish settings 3.4.24 hashed assets"
            git push origin HEAD:root
          else
            echo "Test build already up to date"
          fi
