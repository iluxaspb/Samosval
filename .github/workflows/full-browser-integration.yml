name: Full browser integration audit
# Independent browser acceptance; coin security is not failed by unrelated UI.
on:
  pull_request:
    branches: [root]
    paths:
      - 'tests/full-audit/**'
      - 'test-app/source/**'
      - 'test-app/tabel-v2/**'
      - 'test-app/modules.json'
      - '.github/workflows/full-browser-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Tabel regression and nonblocking Firebase material saves
        run: |
          node --test tests/tabel-v2/*.test.mjs
          node tests/modular/firebase-traffic.test.cjs
          node tests/modular/firebase-traffic-inference.test.cjs
      - name: Verify local-only fixture serves dynamic Tabel modules
        run: node tests/full-audit/browser-support.test.cjs
      - name: Install isolated emulator and Chromium
        run: |
          npm install --prefix /tmp/samosval-browser-qa --no-audit --no-fund firebase@10.8.0 @firebase/rules-unit-testing@3.0.4 firebase-tools@14.20.0 playwright@1.56.1
          /tmp/samosval-browser-qa/node_modules/.bin/playwright install --with-deps chromium
          # Download the pinned Firestore emulator JAR before the standalone
          # browser harness boots it on its own isolated random port.
          printf '%s\n' '{"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > /tmp/samosval-browser-firebase.json
          /tmp/samosval-browser-qa/node_modules/.bin/firebase emulators:exec --config /tmp/samosval-browser-firebase.json --project demo-samosval-browser-audit --only firestore 'echo firestore-emulator-ready'
      - name: Test address rename, pump toggle and per-shift materials
        env:
          NODE_PATH: /tmp/samosval-browser-qa/node_modules
        run: |
          python3 -m pip install playwright==1.56.0
          BROWSER_PATH=$(node -p "require('playwright').chromium.executablePath()")
          python3 -u tests/tabel-v2/material-roster-browser.py --chromium "$BROWSER_PATH"
          python3 -u tests/tabel-v2/weekend-browser.py --chromium "$BROWSER_PATH"
          python3 -u tests/tabel-v2/formula-guide-browser.py --chromium "$BROWSER_PATH"
      - name: End-to-end acceptance with demo Firebase only
        env:
          NODE_PATH: /tmp/samosval-browser-qa/node_modules
        run: |
          export FIRESTORE_EMULATOR_JAR=$(find "$HOME/.cache/firebase/emulators" -name 'cloud-firestore-emulator*.jar' -print -quit)
          test -n "$FIRESTORE_EMULATOR_JAR"
          node tests/full-audit/browser-run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-browser-evidence
          path: tests/full-audit/results/browser/
          retention-days: 7
