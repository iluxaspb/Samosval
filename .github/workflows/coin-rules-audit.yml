name: Coin rules security audit
# Focused coin/Firebase security test. Unrelated code pushes do not run it.
on:
  push:
    branches: ['audit/**']
    paths:
      - 'firestore-coins-test.rules'
      - 'firestore-v3.rules'
      - 'firestore-multiplayer.rules'
      - 'tests/coins/**'
      - 'test-app/source/features/game-coins-v2.js'
      - 'app/src/modules/game-coins-v2.js'
      - '.github/workflows/coin-rules-audit.yml'
  pull_request:
    branches: [root]
    paths:
      - 'firestore-coins-test.rules'
      - 'firestore-v3.rules'
      - 'firestore-multiplayer.rules'
      - 'tests/coins/**'
      - 'test-app/source/features/game-coins-v2.js'
      - 'app/src/modules/game-coins-v2.js'
      - '.github/workflows/coin-rules-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify coin calculations and production/test reward parity
        run: |
          node tests/coins/standalone.cjs
          node tests/coins/admin-settings.cjs
          node tests/coins/test-parity.cjs
      - name: Install local rules emulator
        run: npm install --prefix /tmp/coin-qa --no-audit --no-fund firebase@10.8.0 @firebase/rules-unit-testing@3.0.4 firebase-tools@14.20.0
      - name: Verify coin permissions in isolated Firestore emulator
        env:
          NODE_PATH: /tmp/coin-qa/node_modules
        run: |
          printf '%s\n' '{"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > /tmp/coin-firebase.json
          /tmp/coin-qa/node_modules/.bin/firebase emulators:exec --config /tmp/coin-firebase.json --project demo-coin-rules --only firestore 'node tests/coins/rules.cjs'
