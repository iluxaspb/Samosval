name: Coin rules security audit
on:
  push:
    branches: ['audit/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and SDK
        run: npm install --prefix /tmp/coin-qa --no-audit --no-fund firebase@10.8.0 @firebase/rules-unit-testing@3.0.4 firebase-tools@14.20.0 playwright@1.56.1
      - name: Test candidate rules on isolated emulator
        env:
          NODE_PATH: /tmp/coin-qa/node_modules
        run: |
          printf '%s\n' '{"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > /tmp/coin-firebase.json
          /tmp/coin-qa/node_modules/.bin/firebase emulators:exec --config /tmp/coin-firebase.json --project demo-coin-rules --only firestore 'node tests/coins/rules.cjs'
      - name: Standalone page browser regression
        env:
          NODE_PATH: /tmp/coin-qa/node_modules
        run: |
          /tmp/coin-qa/node_modules/.bin/playwright install --with-deps chromium
          export FIRESTORE_EMULATOR_JAR=$(find "$HOME/.cache/firebase/emulators" -name 'cloud-firestore-emulator*.jar' -print -quit)
          node tests/coins/standalone.cjs
          node tests/full-audit/browser-run.cjs
      - name: Installed PWA upgrade and data preservation
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: /tmp/coin-qa/node_modules
        run: |
          python3 -m pip install playwright==1.57.0
          git fetch --depth=1 origin bd0e906e15a6cafb8b3dd7fd390d0fbc584218a7
          mkdir -p "$RUNNER_TEMP/samosval-old"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/samosval-old"
          BROWSER_PATH=$(node -p "require('playwright').chromium.executablePath()")
          python3 -u tests/pwa/update-browser.py --old-dir "$RUNNER_TEMP/samosval-old" --chromium "$BROWSER_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-browser-evidence
          path: |
            tests/full-audit/results/browser
            test-results/
