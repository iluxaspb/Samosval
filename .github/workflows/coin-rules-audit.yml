name: Coin rules security audit
on:
  push:
    branches: ['audit/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and SDK
        run: npm install --prefix /tmp/coin-qa --no-audit --no-fund firebase@10.8.0 @firebase/rules-unit-testing@3.0.4 firebase-tools@14.20.0
      - name: Test candidate rules on isolated emulator
        env:
          NODE_PATH: /tmp/coin-qa/node_modules
        run: |
          printf '%s\n' '{"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > /tmp/coin-firebase.json
          /tmp/coin-qa/node_modules/.bin/firebase emulators:exec --config /tmp/coin-firebase.json --project demo-coin-rules --only firestore 'node tests/coins/rules.cjs'
