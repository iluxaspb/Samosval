name: Archive viewer test PWA rebuild
on:
  push:
    branches:
      - fix/archive-sheet-overlay-prod-test-20261026
    paths:
      - .github/workflows/archive-viewer-rebuild.yml
      - test-app/src/**
      - test-app/modules.json
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build content-addressed test PWA
        run: python3 tools/build-test.py
      - name: Check PWA and report regressions
        run: |
          node --check "test-app/build/$(python3 -c 'import json;print(json.load(open("test-app/build-manifest.json"))["version"])')/core.js"
          node --check "test-app/build/$(python3 -c 'import json;print(json.load(open("test-app/build-manifest.json"))["version"])')/summary-viewer.js"
          node tests/pwa/service-worker.cjs
          node tests/pwa/run-regressions.cjs
          node tests/png-export/regression.cjs
      - name: Commit generated assets to release branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-test.html sw-test.js test-app/build-manifest.json test-app/build/
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m "Generate verified test PWA build for archive sheet viewer"
          git push origin HEAD:refs/heads/fix/archive-sheet-overlay-prod-test-20261026
