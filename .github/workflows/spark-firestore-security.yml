name: TEST Spark Firestore Rules Emulator (no cloud deploy)
on:
  push:
    branches:
      - feature/test-replication-20261030
    paths:
      - "docs/firestore-spark-line-readonly.fragment.rules"
      - "docs/firestore-spark-line-write-experimental.fragment.rules"
      - "firestore-v3.rules"
      - "server/scripts/build-spark-rules.mjs"
      - "server/tests/test-spark-rules-emulator.cjs"
      - "server/tests/test-spark-write-emulator.cjs"
      - "test-app/synology/spark-line-writer.mjs"
      - ".github/workflows/spark-firestore-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-rules:
    name: Prove Firebase Spark reads and deny all client writes locally
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install local emulator and test SDK, no cloud authorization
        run: |
          npm install --prefix /tmp/samosval-spark-emulator --no-audit --no-fund \
            firebase-tools@14.17.0 @firebase/rules-unit-testing@4.0.1 firebase@11.9.1
      - name: Compose isolated experimental TEST rules without changing live rules
        env:
          SPARK_EXPERIMENTAL_WRITES: "1"
        run: |
          node server/scripts/build-spark-rules.mjs /tmp/samosval-spark-emulator.rules
          cat > /tmp/samosval-spark-emulator.json <<'JSON'
          {
            "firestore": {"rules": "/tmp/samosval-spark-emulator.rules"},
            "emulators": {"firestore": {"host": "127.0.0.1", "port": 8089}, "ui": {"enabled": false}}
          }
          JSON
      - name: Run local two-user auth, ACL, table and tampering tests
        env:
          NODE_PATH: /tmp/samosval-spark-emulator/node_modules
          CI: "true"
        run: |
          /tmp/samosval-spark-emulator/node_modules/.bin/firebase emulators:exec \
            --project demo-samosval-spark-ci \
            --config /tmp/samosval-spark-emulator.json \
            --only firestore \
            "node --test --test-concurrency=1 server/tests/test-spark-rules-emulator.cjs server/tests/test-spark-write-emulator.cjs"
      - name: Reminder — no Firebase Console deployment occurred
        run: |
          echo 'Only a temporary local Firestore emulator was used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All live Firestore Rules and NAS containers remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
