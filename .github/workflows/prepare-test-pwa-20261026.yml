name: Prepare test PWA 3.1.19
on:
  push:
    branches:
      - fix/archive-png-wysiwyg-20261026
    paths:
      - .github/workflows/prepare-test-pwa-20261026.yml
permissions:
  contents: write
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build content-addressed test application
        run: python3 tools/build-test.py
      - name: Verify test PWA and PNG regressions
        run: |
          set -eu
          node tests/pwa/modules.cjs
          node tests/pwa/service-worker.cjs
          node tests/pwa/run-regressions.cjs
          node tests/png-export/regression.cjs
      - name: Commit PWA HTML, assets and offline verification together
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-test.html sw-test.js test-app/build-manifest.json test-app/build/
          if ! git diff --cached --quiet; then
            git commit -m "build(test): produce verified 3.1.19 offline bundle"
            git push origin "HEAD:refs/heads/fix/archive-png-wysiwyg-20261026"
          fi
