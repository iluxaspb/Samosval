name: Production source integrity
on:
  push:
    branches: [root]
    paths:
      - 'working-test/**'
      - 'index.html'
      - 'index-working-test.html'
      - 'sw.js'
      - 'sw-working-test.js'
      - 'version.json'
      - 'manifest-working-test.webmanifest'
      - 'tools/build-working-test.py'
      - 'tools/check-production-integrity.py'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify working-test line integrity (reproducible build / prod kit self-consistency)
        run: python3 tools/check-production-integrity.py
      - name: Syntax check of the channel service worker
        run: node --check sw-working-test.js
