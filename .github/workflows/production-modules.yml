name: Production modular release verification
on:
  push:
    branches: ['release/production-modular-3.4.13-20261027', root]
    paths: ['app/**', 'index.html', 'sw.js', 'manifest.json', 'tools/build-release.py', 'tools/verify-production-modules.py', 'tests/production-modules/**', '.github/workflows/production-modules.yml', 'tests/full-audit/browser-*.cjs']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify production build and test isolation
        run: |
          git fetch --depth=1 origin 8b0bd65b3c94d2d51e8e611bc9644800ddd58291
          python3 tools/verify-production-modules.py
      - name: Install local test dependencies
        run: |
          npm install --prefix /tmp/prod-qa --no-audit --no-fund firebase@10.8.0 @firebase/rules-unit-testing@3.0.4 firebase-tools@14.20.0 playwright@1.56.1
          /tmp/prod-qa/node_modules/.bin/firebase setup:emulators:firestore
          python3 -m pip install playwright==1.57.0
      - name: Actual production page desktop/mobile and Firestore emulator
        env:
          NODE_PATH: /tmp/prod-qa/node_modules
          AUDIT_PRODUCTION: '1'
        run: |
          export AUDIT_BROWSER=$(command -v google-chrome)
          export FIRESTORE_EMULATOR_JAR=$(find "$HOME/.cache/firebase/emulators" -name 'cloud-firestore-emulator*.jar' -print -quit)
          node tests/full-audit/browser-run.cjs
      - name: Upgrade installed production without clearing operator data
        run: python3 -u tests/production-modules/upgrade.py --chromium "$(command -v google-chrome)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-modules-evidence
          path: |
            tests/full-audit/results/
            test-results/
