name: Modular test application audit
on:
  push:
    branches: ['audit/**', 'feature/synology-**', root, release/test-modules-3.4.12-20261027]
    paths:
      - 'test-app/source/**'
      - 'test-app/synology/**'
      - 'test-app/tabel-v2/**'
      - 'test-app/src/pwa.js'
      - 'tests/tabel-v2/**'
      - 'tests/pwa/**'
      - 'tests/backend-mode/**'
      - test-app/modules.json
      - tools/build-test.py
      - tools/verify-test-modules.py
      - .github/workflows/modular-audit.yml
      - test-app/build-manifest.json
      - index-test.html
      - sw-test.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current test modules, PWA integrity and reproducible build
        run: python3 tools/verify-test-modules.py
      - name: TEST backend selection controller
        run: |
          node tests/backend-mode/controller.cjs
          node tests/backend-mode/probe.cjs
          node --check test-app/synology/connection-check.mjs
          node --test server/tests/connection-check.test.mjs
      - name: Timesheet regressions and active-address defaults
        run: node --test tests/tabel-v2/*.test.mjs
      - name: Coins and offline cache regressions on actual built code
        run: |
          node tests/coins/standalone.cjs
          node tests/pwa/service-worker.cjs
          node -r ./tests/pwa/legacy-loader.cjs tests/coins/admin-settings.cjs
          node -r ./tests/pwa/legacy-loader.cjs tests/coins/test-parity.cjs
  pwa-upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          if command -v google-chrome >/dev/null; then
            echo "PWA_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python3 -m playwright install --with-deps chromium
          fi
      - name: Generate current test build and verify current assets
        run: python3 tools/build-test.py
      - name: TEST backend modes and header on mobile/landscape
        run: |
          if [ -n "${PWA_CHROMIUM:-}" ]; then
            python3 -u tests/backend-mode/browser.py --chromium "$PWA_CHROMIUM"
          else
            python3 -u tests/backend-mode/browser.py
          fi
      - name: Mobile UI address default and consent per tab visit
        run: |
          if [ -n "${PWA_CHROMIUM:-}" ]; then
            python3 -u tests/tabel-v2/active-address-browser.py --chromium "$PWA_CHROMIUM"
          else
            python3 -u tests/tabel-v2/active-address-browser.py
          fi
      - name: Verify real PWA upgrade and recover without deleting pending trips
        run: |
          git fetch --depth=1 origin ff4e9a8c97526e557e6bb38607e606e88b4df2ee
          mkdir -p "$RUNNER_TEMP/samosval-old"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/samosval-old"
          if [ -n "${PWA_CHROMIUM:-}" ]; then
            python3 -u tests/pwa/update-browser.py --old-dir "$RUNNER_TEMP/samosval-old" --expected-old-build 0f0881040d710261 --chromium "$PWA_CHROMIUM"
          else
            python3 -u tests/pwa/update-browser.py --old-dir "$RUNNER_TEMP/samosval-old" --expected-old-build 0f0881040d710261
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-pwa-upgrade
          path: test-results/

