name: Modular test application audit
on:
  push:
    branches: ['audit/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modular-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: |
          npm install --prefix /tmp/samosval-qa --no-audit --no-fund jsdom@26.0.0 firebase@10.8.0 @firebase/rules-unit-testing@3.0.4 playwright@1.56.1 firebase-tools@14.20.0
          echo "NODE_PATH=/tmp/samosval-qa/node_modules" >> "$GITHUB_ENV"
          echo "/tmp/samosval-qa/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build current TEST sources
        run: python3 tools/build-test.py
      - name: Run source, integration and DOM regressions
        run: node tests/full-audit/run.cjs
      - name: Install Chromium and local Firestore emulator
        run: |
          playwright install --with-deps chromium
          firebase setup:emulators:firestore
          echo "FIRESTORE_EMULATOR_JAR=$(find "$HOME/.cache/firebase/emulators" -name 'cloud-firestore-emulator*.jar' -print -quit)" >> "$GITHUB_ENV"
      - name: Run real Firestore concurrency regressions
        run: node tests/full-audit/offline-emulator.cjs
      - name: Browser click walkthrough
        run: |
          if test -f tests/full-audit/browser-run.cjs; then
            node tests/full-audit/browser-run.cjs
          else
            echo 'Browser harness is not integrated yet; this is not a full acceptance run.'
            exit 1
          fi
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-audit-evidence
          path: |
            tests/full-audit/results/
            /tmp/samosval-audit-*/
          if-no-files-found: warn
