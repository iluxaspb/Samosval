name: Synology server test foundation
on:
  push:
    branches:
      - "feature/synology-**"
    paths:
      - "server/**"
      - "test-app/synology/**"
      - ".github/workflows/synology-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samosval_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: samosval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samosval_test -d samosval_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://samosval_test:ci_only_password@localhost:5432/samosval_test
      FIREBASE_PROJECT_ID: samosval-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Apply SQL to isolated CI database
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.TEST_DATABASE_URL });
          await client.connect();
          try {
            await client.query(readFileSync('sql/001_init.sql','utf8'));
          } finally {
            await client.end();
          }
          NODE
      - run: npm test

