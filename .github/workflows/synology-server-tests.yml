name: Synology server test foundation
on:
  push:
    branches:
      - "feature/synology-**"
      - "fix/nas-ticker-plate-20261030"
      - "feature/wtest-parallel-shifts-20261123"
    paths:
      - "server/**"
      - "test-app/synology/**"
      - ".github/workflows/synology-server-tests.yml"
  pull_request:
    branches:
      - "feature/synology-**"
      - root
      - "fix/nas-ticker-plate-20261030"
      - "feature/wtest-parallel-shifts-20261123"
    paths:
      - "server/**"
      - "test-app/synology/**"
      - ".github/workflows/synology-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: server
    env:
      FIREBASE_PROJECT_ID: samosval-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # The isolated DB harness (scripts/test-isolated-db.mjs) requires a real
      # PostgreSQL 16 on 127.0.0.1:55432 with database `postgres`, role
      # samosval_test_orchestrator and the samosval.isolated_db_bootstrap marker.
      # server/compose.test.yaml + scripts/isolated-db/bootstrap.sh create all of
      # that during initdb, so no manual SQL step is needed here any more.
      - name: Generate isolated database passwords
        run: |
          set -eu
          for name in POSTGRES_PASSWORD \
                      SAMOSVAL_ORCHESTRATOR_PASSWORD \
                      SAMOSVAL_TEST_APP_PASSWORD \
                      SAMOSVAL_TEST_RUNTIME_PASSWORD \
                      SAMOSVAL_TEST_MAINTENANCE_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          echo "POSTGRES_TEST_PORT=55432" >> "$GITHUB_ENV"
      - name: Start isolated PostgreSQL 16 (docker compose)
        run: |
          set -eu
          if docker compose version >/dev/null 2>&1; then
            compose="docker compose"
          else
            compose="docker-compose"
          fi
          if $compose -f compose.test.yaml --profile test up -d --wait; then
            exit 0
          fi
          echo "::warning::compose --wait unavailable or failed, falling back to health polling"
          $compose -f compose.test.yaml --profile test up -d
          container="$($compose -f compose.test.yaml --profile test ps -q postgres)"
          if [ -z "$container" ]; then
            echo "::error::the isolated postgres container was not created"
            exit 1
          fi
          status=unknown
          attempt=1
          while [ "$attempt" -le 60 ]; do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo unknown)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "::error::the isolated postgres container did not become healthy (status: $status)"
          $compose -f compose.test.yaml --profile test logs postgres
          exit 1
      - name: Run isolated database suite
        # TEST_DATABASE_URL must stay unset: the harness generates the per-test
        # target URL itself and fails closed if a runner supplies one.
        run: |
          set -eu
          export SAMOSVAL_ISOLATED_TEST=1
          export SAMOSVAL_TEST_ADMIN_URL="postgresql://samosval_test_orchestrator:${SAMOSVAL_ORCHESTRATOR_PASSWORD}@localhost:55432/postgres"
          export SAMOSVAL_TEST_BOOTSTRAP_URL="postgresql://samosval_test_bootstrap_admin:${POSTGRES_PASSWORD}@localhost:55432/postgres"
          export SAMOSVAL_ISOLATED_REPORT="$PWD/isolated-report.json"
          sh scripts/test-isolated-db.sh
      - name: Upload isolated database report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-db-report
          path: server/isolated-report.json
          if-no-files-found: ignore
      - name: Stop isolated PostgreSQL
        if: always()
        working-directory: server
        run: |
          docker compose -f compose.test.yaml --profile test down -v --remove-orphans \
            || echo "::warning::isolated database cleanup failed"
      # verify-test-modules.py удалён вместе с мёртвым каналом test-app (ревизия 22.11.2026)
      - name: Tabel calculation and queue regressions
        working-directory: .
        run: node --test tests/tabel-v2/*.test.mjs

  verify-control-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chromium acceptance tools
        run: |
          npm install --prefix /tmp/control-browser --no-audit --no-fund playwright@1.56.1
          /tmp/control-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify two-window updates, data guards and mobile table tools
        env:
          NODE_PATH: /tmp/control-browser/node_modules
          PLAYWRIGHT_MODULE: /tmp/control-browser/node_modules/playwright
        run: |
          export PWA_BROWSER=$(node -p "require('playwright').chromium.executablePath()")
          node tests/pwa/update-ui.cjs
          node tests/tabel-v2/simple-keypad-browser.cjs
          node tests/tabel-v2/release-410-browser.cjs
          node tests/tabel-v2/table-tools-browser.cjs
      - name: Build independent control image and verify Docker Compose availability
        run: |
          docker build -t samosval-test-api:ci server
          docker build -f server/updater/Dockerfile --build-arg API_BASE=samosval-test-api:ci -t samosval-test-control:ci server
          docker run --rm --network none --entrypoint docker samosval-test-control:ci compose version
