name: Synology server test foundation
on:
  push:
    branches:
      - "feature/synology-**"
      - "feature/test-replication-20261030"
      - "root"
      - "fix/nas-ticker-plate-20261030"
    paths:
      - "server/**"
      - "test-app/synology/**"
      - ".github/workflows/synology-server-tests.yml"
  pull_request:
    branches:
      - "feature/synology-**"
      - root
      - "fix/nas-ticker-plate-20261030"
    paths:
      - "server/**"
      - "test-app/synology/**"
      - ".github/workflows/synology-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samosval_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: samosval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samosval_test -d samosval_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://samosval_test:ci_only_password@localhost:5432/samosval_test
      FIREBASE_PROJECT_ID: samosval-offline
    steps:
      - uses: actions/checkout@v4
        with:
          # Never build from GitHub's synthetic PR merge SHA. The release
          # manifest and NAS CI proof must name this same immutable head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validate isolated worker upgrade script
        run: sh -n updater/upgrade-test-control-worker.sh
      - name: Verify checksummed worker bootstrap package
        run: python3 scripts/package-control-bootstrap.py /tmp/samosval-control-package.zip
      - name: Apply SQL to isolated CI database
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.TEST_DATABASE_URL });
          await client.connect();
          try {
            await client.query(readFileSync('sql/001_init.sql','utf8'));
            await client.query(readFileSync('sql/002_tabel.sql','utf8'));
            await client.query(readFileSync('sql/003_shift_close.sql','utf8'));
            await client.query(readFileSync('sql/004_objects.sql','utf8'));
            await client.query(readFileSync('sql/005_controls.sql','utf8'));
            await client.query(readFileSync('sql/006_identity.sql','utf8'));
            await client.query(readFileSync('sql/007_line_history.sql','utf8'));
            await client.query(readFileSync('sql/008_workspace_services.sql','utf8'));
            await client.query(readFileSync('sql/009_auxiliary.sql','utf8'));
            await client.query(readFileSync('sql/010_reports.sql','utf8'));
            await client.query(readFileSync('sql/011_backups.sql','utf8'));
            await client.query(readFileSync('sql/012_notifications.sql','utf8'));
            await client.query(readFileSync('sql/013_server_control.sql','utf8'));
            await client.query(readFileSync('sql/014_reserve_outbox.sql','utf8'));
          } finally {
            await client.end();
          }
          NODE
      - name: Verify TEST modular build without publishing
        run: python3 ../tools/verify-test-modules.py
      - run: npm test
      - name: Tabel calculation and queue regressions
        working-directory: .
        run: node --test tests/tabel-v2/*.test.mjs

  verify-control-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Never build from GitHub's synthetic PR merge SHA. The release
          # manifest and NAS CI proof must name this same immutable head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chromium acceptance tools
        run: |
          npm install --prefix /tmp/control-browser --no-audit --no-fund playwright@1.56.1
          /tmp/control-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify two-window updates, data guards and mobile table tools
        env:
          NODE_PATH: /tmp/control-browser/node_modules
          PLAYWRIGHT_MODULE: /tmp/control-browser/node_modules/playwright
        run: |
          export PWA_BROWSER=$(node -p "require('playwright').chromium.executablePath()")
          node tests/pwa/update-ui.cjs
          node tests/pwa/control-center-navigation.cjs
          node tests/tabel-v2/simple-keypad-browser.cjs
          node tests/tabel-v2/release-410-browser.cjs
          node tests/tabel-v2/table-tools-browser.cjs
      - name: Build independent control image and verify Docker Compose availability
        run: |
          docker build -t samosval-test-api:ci server
          docker build -f server/updater/Dockerfile --build-arg API_BASE=samosval-test-api:ci -t samosval-test-control:ci server
          docker run --rm --network none --entrypoint docker samosval-test-control:ci compose version

  package-tested-release:
    name: Package TEST release only after both suites pass
    needs: [verify-server, verify-control-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create checksum-verified worker archive and pinned API manifest
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 server/scripts/package-control-bootstrap.py /tmp/samosval-control-package.zip
          node server/scripts/prepare-control-release.mjs 4.1.2
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {normalizeRelease} from './server/updater/release.mjs';
          const manifest=normalizeRelease(JSON.parse(readFileSync('releases/nas-test.json','utf8')));
          const sha=b=>createHash('sha256').update(b).digest('hex');
          if(manifest.commit!==process.env.VERIFIED_HEAD || manifest.version!=='4.1.2' ||
             manifest.migrations.length!==0)
            throw Error('candidate-head-or-schema-mismatch');
          for(const file of [...manifest.files,...manifest.migrations]){
            const data=readFileSync('server/'+file.path);
            if(data.length!==file.bytes||sha(data)!==file.sha256)throw Error('source-hash-mismatch:'+file.path);
          }
          console.log('VERIFIED_TEST_CANDIDATE',manifest.commit,manifest.version);
          NODE
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('/tmp/samosval-control-package.zip') as archive:
            entries=archive.namelist()
            assert 'SHA256SUMS' in entries and 'updater/upgrade-test-control-worker.sh' in entries
            for line in archive.read('SHA256SUMS').decode().splitlines():
              expected,name=line.split('  ',1)
              assert hashlib.sha256(archive.read(name)).hexdigest()==expected,name
          print('VERIFIED_WORKER_ARCHIVE')
          PY
      - name: Publish verified TEST control-worker archive
        uses: actions/upload-artifact@v4
        with:
          name: samosval-test-control-worker-412-verified
          path: /tmp/samosval-control-package.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified TEST API release manifest
        uses: actions/upload-artifact@v4
        with:
          name: samosval-nas-test-412-manifest-verified
          path: releases/nas-test.json
          if-no-files-found: error
          retention-days: 7

  publish-tested-manifest:
    name: Publish TEST 4.1.2 server manifest to root after all gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/root'
    needs: [verify-server, verify-control-browser, package-tested-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: samosval-test-server-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned, checksummed API-only manifest
        env:
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          node server/scripts/prepare-control-release.mjs 4.1.2
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {normalizeRelease} from './server/updater/release.mjs';
          const m=normalizeRelease(JSON.parse(readFileSync('releases/nas-test.json','utf8')));
          if(m.commit!==process.env.VERIFIED_HEAD||m.version!=='4.1.2'||m.migrations.length!==0)
            throw Error('tested-source-mismatch');
          console.log('VERIFIED_RELEASE_MANIFEST',m.commit,m.files.length);
          NODE
      - name: Commit TEST-only server manifest without touching production
        env:
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          cp releases/nas-test.json /tmp/samosval-nas-412.json
          git restore releases/nas-test.json
          git fetch origin root
          git switch -C tested-manifest-publish origin/root
          if ! git diff --quiet "$VERIFIED_HEAD" HEAD -- server/src server/sql server/package.json; then
            echo "::error::Server source changed on root after tests; refuse stale release manifest"
            exit 1
          fi
          cp /tmp/samosval-nas-412.json releases/nas-test.json
          git config user.name "Samosval TEST Release"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/nas-test.json
          if git diff --cached --quiet; then
            echo "Server manifest is already verified and published"
          else
            git commit -m "release(test): publish checksummed server API 4.1.2"
            git push origin HEAD:root
          fi
