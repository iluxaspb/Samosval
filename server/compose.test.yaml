# Ephemeral isolated database for automated tests only.
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    restart: "no"
    environment:
      POSTGRES_DB: samosval_parallel_shifts_test
      POSTGRES_USER: ${POSTGRES_USER:-samosval_test_runner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the isolated test database}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
