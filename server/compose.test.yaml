# Isolated TEST environment only. PostgreSQL is never published to the Internet.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: samosval-test-api:read-v1-20261030
    build: .
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      PGHOST: postgres
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8080/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3

volumes:
  postgres_test_data:

