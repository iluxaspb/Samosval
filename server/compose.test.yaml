# Local isolated TEST environment. No service binds beyond host loopback.
services:
  postgres:
    profiles: ["test"]
    image: postgres:16-alpine
    restart: "no"
    command:
      - postgres
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: samosval_test_bootstrap_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a runtime-generated bootstrap password}
      SAMOSVAL_ORCHESTRATOR_PASSWORD: ${SAMOSVAL_ORCHESTRATOR_PASSWORD:?set a runtime-generated orchestrator password}
      SAMOSVAL_TEST_APP_PASSWORD: ${SAMOSVAL_TEST_APP_PASSWORD:?set a runtime-generated test app password}
      SAMOSVAL_TEST_RUNTIME_PASSWORD: ${SAMOSVAL_TEST_RUNTIME_PASSWORD:?set a runtime-generated runtime password}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/isolated-db/bootstrap.sh:/docker-entrypoint-initdb.d/10-isolated-db-bootstrap.sh:ro
      - ./scripts/isolated-db/bootstrap.sql:/opt/samosval/isolated-db-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
