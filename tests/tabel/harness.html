// Support the bridge's composite equality/range queries in this QA server.
__query=function(collection,filters,cap){if(filters&&typeof filters[0]==='string')filters=[[filters[0],'==',filters[1]]];let docs=[...__rows.keys()].filter(k=>k.startsWith(collection+'/')&&k.split('/').length===collection.split('/').length+1).map(__snapshot);for(const [key,op,value]of filters||[])docs=docs.filter(s=>op==='=='?s.data()[key]===value:op==='>='?s.data()[key]>=value:s.data()[key]<value);return {docs:docs.slice(0,cap||Infinity),metadata:{fromCache:!navigator.onLine,hasPendingWrites:false}};};
